name: "English · Correction or removal"
description: "Correct a profile, category, count, or request removal"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "X profile URL"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "Requested change"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "Updated profile data and observation time"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context (optional)"
    validations:
      required: false
