name: "English · Correction or removal"
description: "Report a renamed handle, incorrect description, or removal request"
title: "[Correction] "
body:
  - type: input
    id: handle
    attributes:
      label: "Affected account"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What needs changing"
      description: "Do not include private information."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence or explanation"
      description: "For renames, provide both old and new entry points. A login wall does not prove deletion."
    validations:
      required: true
