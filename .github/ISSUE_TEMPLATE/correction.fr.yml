name: "Français · Correction ou suppression"
description: "Corriger un profil, une catégorie, un nombre ou demander une suppression"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "URL du profil X"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "Modification demandée"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "Données actualisées et date du relevé"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Contexte supplémentaire (facultatif)"
    validations:
      required: false
