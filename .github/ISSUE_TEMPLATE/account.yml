name: "English · Submit an account"
description: "Add a public AI or technology X account"
title: "[Account] "
body:
  - type: input
    id: url
    attributes:
      label: "X profile URL"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: "Category ID"
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: "Profile bio — copy the original text"
    validations:
      required: false
  - type: input
    id: followers
    attributes:
      label: "Follower count — exact integer, if available"
    validations:
      required: false
  - type: input
    id: observed_at
    attributes:
      label: "Observation time with timezone"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Additional context (optional)"
    validations:
      required: false
