name: "English · Suggest an account"
description: "Recommend a public AI, LLM, agent, or technology account"
title: "[Account] "
body:
  - type: input
    id: name
    attributes:
      label: "Name or organization"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: "Full X profile URL"
      placeholder: "https://x.com/handle"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Account type"
      options:
        - "Person"
        - "Organization"
        - "Media"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Topic and reason to follow"
      description: "Describe concrete work or useful content, not just popularity."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "First-party evidence"
      description: "Link to an owner-controlled page or the account's own X content."
    validations:
      required: true
  - type: input
    id: relation
    attributes:
      label: "Your relationship to the account"
      placeholder: "None / self / colleague / other"
    validations:
      required: true
