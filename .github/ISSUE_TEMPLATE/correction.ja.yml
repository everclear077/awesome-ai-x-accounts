name: "日本語 · 訂正または削除"
description: "紹介文・分類・人数の訂正や削除依頼"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "X プロフィール URL"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "希望する変更"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "更新したプロフィールと取得日時"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "補足事項（任意）"
    validations:
      required: false
