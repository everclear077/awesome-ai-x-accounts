name: "简体中文 · 提交账号"
description: "收录 AI 或科技领域的公开 X 账号"
title: "[Account] "
body:
  - type: input
    id: url
    attributes:
      label: "X 主页链接"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: "分类 ID"
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: "简介：复制账号原文"
    validations:
      required: false
  - type: input
    id: followers
    attributes:
      label: "粉丝数：可获取时填写精确整数"
    validations:
      required: false
  - type: input
    id: observed_at
    attributes:
      label: "带时区的采集时间"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "补充说明（可选）"
    validations:
      required: false
