name: "Русский · Исправление или удаление"
description: "Исправить профиль, категорию, число или запросить удаление"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "URL профиля X"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "Нужное изменение"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "Обновлённые данные и время наблюдения"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Дополнительный контекст (необязательно)"
    validations:
      required: false
