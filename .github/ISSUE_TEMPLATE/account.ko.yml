name: "한국어 · 계정 제출"
description: "AI 또는 기술 분야의 공개 X 계정 추가"
title: "[Account] "
body:
  - type: input
    id: url
    attributes:
      label: "X 프로필 URL"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: "분류 ID"
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: "소개 — 원문 그대로 복사"
    validations:
      required: false
  - type: input
    id: followers
    attributes:
      label: "팔로워 수 — 조회할 수 있으면 정확한 정수"
    validations:
      required: false
  - type: input
    id: observed_at
    attributes:
      label: "시간대가 포함된 수집 시각"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "추가 설명 (선택)"
    validations:
      required: false
