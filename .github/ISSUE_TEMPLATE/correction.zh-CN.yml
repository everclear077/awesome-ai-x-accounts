name: "简体中文 · 纠错或移除"
description: "修改简介、分类、粉丝数或申请移除"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "X 主页链接"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "需要修改的内容"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "更新的资料与采集时间"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "补充说明（可选）"
    validations:
      required: false
