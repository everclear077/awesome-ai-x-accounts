name: "简体中文 · 纠错或移除"
description: "报告更名、错误描述或申请移除"
title: "[Correction] "
body:
  - type: input
    id: handle
    attributes:
      label: "涉及的账号"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "需要修改的内容"
      description: "请勿公开私人信息。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "证据或说明"
      description: "更名请附旧、新入口；登录墙不能证明账号已注销。"
    validations:
      required: true
