name: "한국어 · 수정 또는 삭제"
description: "소개, 분류, 팔로워 수 수정 또는 삭제 요청"
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: "X 프로필 URL"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: "요청할 변경 사항"
    validations:
      required: true
  - type: textarea
    id: snapshot
    attributes:
      label: "갱신한 프로필과 수집 시각"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "추가 설명 (선택)"
    validations:
      required: false
