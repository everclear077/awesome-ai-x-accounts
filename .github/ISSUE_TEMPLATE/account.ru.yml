name: "Русский · Предложить аккаунт"
description: "Добавить публичный аккаунт X об ИИ или технологиях"
title: "[Account] "
body:
  - type: input
    id: url
    attributes:
      label: "URL профиля X"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: "ID категории"
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: "Описание — скопируйте оригинал"
    validations:
      required: false
  - type: input
    id: followers
    attributes:
      label: "Подписчики — точное целое число, если доступно"
    validations:
      required: false
  - type: input
    id: observed_at
    attributes:
      label: "Время наблюдения с часовым поясом"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Дополнительный контекст (необязательно)"
    validations:
      required: false
