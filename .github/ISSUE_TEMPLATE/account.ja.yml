name: "日本語 · アカウントの提出"
description: "AI・技術分野の公開 X アカウントを追加"
title: "[Account] "
body:
  - type: input
    id: url
    attributes:
      label: "X プロフィール URL"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: "分類 ID"
    validations:
      required: true
  - type: textarea
    id: bio
    attributes:
      label: "紹介文 — 原文をそのままコピー"
    validations:
      required: false
  - type: input
    id: followers
    attributes:
      label: "フォロワー数 — 取得できれば正確な整数"
    validations:
      required: false
  - type: input
    id: observed_at
    attributes:
      label: "タイムゾーン付きの取得日時"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "補足事項（任意）"
    validations:
      required: false
